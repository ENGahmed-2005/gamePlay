<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مغامرة الهاء الخارقة</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Tahoma,sans-serif}
.fade{animation:fade .3s}
@keyframes fade{from{opacity:.3;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-200 via-green-100 to-emerald-300 flex items-center justify-center p-4">

<div class="bg-white w-full max-w-3xl rounded-3xl shadow-2xl p-6">

<div id="startScreen">
<h1 class="text-4xl font-bold text-center text-green-700 mb-4">🚀 مغامرة الهاء الخارقة</h1>
<p class="text-center mb-6">اختر مستوى اللعب</p>

<div class="grid md:grid-cols-3 gap-3">
<button onclick="startGame(1)" class="bg-blue-500 text-white p-4 rounded-xl">مبتدئ</button>
<button onclick="startGame(2)" class="bg-orange-500 text-white p-4 rounded-xl">متوسط</button>
<button onclick="startGame(3)" class="bg-red-500 text-white p-4 rounded-xl">أسطوري</button>
</div>
</div>

<div id="gameScreen" class="hidden">

<div class="grid grid-cols-4 gap-2 mb-4 text-center">
<div class="bg-green-100 p-2 rounded">🏆<div id="xp">0</div></div>
<div class="bg-blue-100 p-2 rounded">✅<div id="correct">0</div></div>
<div class="bg-red-100 p-2 rounded">❌<div id="wrong">0</div></div>
<div class="bg-yellow-100 p-2 rounded">⏱️<div id="timer">60</div></div>
</div>

<div class="w-full bg-gray-200 rounded-full h-5 mb-5">
<div id="progress" class="bg-green-500 h-5 rounded-full" style="width:0%"></div>
</div>

<div id="message" class="hidden text-center p-3 rounded-xl mb-4"></div>

<div class="text-center fade">
<h2 class="text-3xl font-bold mb-6" id="question"></h2>
<div id="options" class="grid md:grid-cols-2 gap-4"></div>
</div>

</div>

<div id="endScreen" class="hidden text-center">
<h2 class="text-4xl font-bold mb-4">🎉 انتهت اللعبة</h2>
<p class="mb-2">النقاط: <span id="finalXp"></span></p>
<p class="mb-2">الإجابات الصحيحة: <span id="finalCorrect"></span></p>
<p class="mb-2">أفضل نتيجة: <span id="bestScore"></span></p>
<button onclick="location.reload()" class="mt-4 bg-green-600 text-white px-6 py-3 rounded-xl">إعادة اللعب</button>
</div>

</div>

<script>
const words=[];

const first=["هلال","هندسة","هاتف","هدية","هواء","هروب","همس","هرم","هداية","هدوء"];
const middle=["سهم","فهم","مهندس","مهنة","زهر","شهد","نهضة","جهد","ذهب","شهادة"];
const endConnected=["وجه","فقيه","نبيه","وجيه","شبيه","تنبيه","سفيه","نزيه","وجيه","فقيه"];
const endSeparate=["مياه","شفاه","اتجاه","رفاه","أفواه","أشباه","منتهاه","ذكراه","وجاه","مسعاه"];

for(let i=0;i<3;i++){
first.forEach(w=>words.push({q:w,ans:"أول الكلمة"}));
middle.forEach(w=>words.push({q:w,ans:"وسط الكلمة"}));
endConnected.forEach(w=>words.push({q:w,ans:"آخر متصل"}));
endSeparate.forEach(w=>words.push({q:w,ans:"آخر منفصل"}));
}

let xp=0,correct=0,wrong=0,time=60,used=[],current=[];
let timerId;

function startGame(level){
document.getElementById("startScreen").classList.add("hidden");
document.getElementById("gameScreen").classList.remove("hidden");

time={1:90,2:60,3:45}[level];
document.getElementById("timer").textContent=time;

current=[...words];
shuffle(current);

timerId=setInterval(()=>{
time--;
document.getElementById("timer").textContent=time;
if(time<=0||current.length===0) endGame();
},1000);

nextQuestion();
}

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
}

function nextQuestion(){
if(current.length===0){endGame();return;}
const q=current.pop();
window.answer=q.ans;

document.getElementById("question").textContent=`أين يقع حرف الهاء في كلمة: ${q.q}`;

const options=["أول الكلمة","وسط الكلمة","آخر متصل","آخر منفصل"];
shuffle(options);

const box=document.getElementById("options");
box.innerHTML="";

options.forEach(op=>{
const btn=document.createElement("button");
btn.className="p-4 border-2 border-green-500 rounded-xl hover:bg-green-100";
btn.textContent=op;
btn.onclick=()=>check(op);
box.appendChild(btn);
});

updateProgress();
}

function check(selected){
if(selected===answer){
xp+=10;
correct++;
showMsg("🎉 إجابة صحيحة","bg-green-500");
}else{
wrong++;
showMsg("❌ إجابة خاطئة","bg-red-500");
}
updateStats();
setTimeout(nextQuestion,500);
}

function showMsg(text,color){
const m=document.getElementById("message");
m.className=color+" text-white text-center p-3 rounded-xl mb-4";
m.textContent=text;
m.classList.remove("hidden");
setTimeout(()=>m.classList.add("hidden"),800);
}

function updateStats(){
document.getElementById("xp").textContent=xp;
document.getElementById("correct").textContent=correct;
document.getElementById("wrong").textContent=wrong;
}

function updateProgress(){
const done=words.length-current.length;
const percent=(done/words.length)*100;
document.getElementById("progress").style.width=percent+"%";
}

function endGame(){
clearInterval(timerId);
document.getElementById("gameScreen").classList.add("hidden");
document.getElementById("endScreen").classList.remove("hidden");

const best=Math.max(
xp,
Number(localStorage.getItem("bestScore")||0)
);

localStorage.setItem("bestScore",best);

document.getElementById("finalXp").textContent=xp;
document.getElementById("finalCorrect").textContent=correct;
document.getElementById("bestScore").textContent=best;
}
</script>

</body>
</html>
